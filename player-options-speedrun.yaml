# Dave the Diver - Speedrun Configuration
# Defeat Yawie as fast as possible! Minimal checks, maximum speed.

name: SpeedRunner

game: Dave the Diver

Dave the Diver:

  # Goal: Just defeat the final boss
  goal: defeat_yawie

  # Only rare/deep fish (skip shallow grinding)
  fish_checks: rare_only

  # No dish research checks
  dish_upgrades: none

  # Only key story recipes
  recipe_checks: key_only

  # Skip all side content
  include_cooksta: false
  include_ecowatcher: false
  include_photography: false
  include_challenges: false
  include_farming: false
  include_chicken_farm: false
  include_fish_farm: false
  include_minigames: false
  include_weapon_shop: false

  # No staff checks for speedruns
  staff_training_depth: none

  # No ingredient checks for speedruns
  include_ingredient_checks: false

  # No DLC for clean speedruns
  has_dredge_dlc: false
  has_godzilla_dlc: false
  has_ichiban_dlc: false
  has_jungle_dlc: false

  # Start with better gear for faster progression
  starting_oxygen_level: 2
  starting_harpoon_level: 2
  starting_diving_suit_level: 2

  # Lenient difficulty — don't want to be blocked by oxygen gates
  oxygen_requirement: lenient

  # No death link for speedruns
  death_link: false

  trap_frequency: none
