# Dave the Diver - Example Player Options
# Copy this file and customize it for your multiworld game!
# Full option documentation: docs/SETUP_GUIDE.md

# Your player name (what others will see in the multiworld)
name: YourName

# The game you're playing
game: Dave the Diver

# Accessibility options (for all Archipelago games)
accessibility: items

# ====================
# DAVE THE DIVER OPTIONS
# ====================

Dave the Diver:

  # ==================== GOAL ====================
  # What you need to do to complete the game.
  # Options:
  #   defeat_yawie          - Defeat the final boss (~15-25 hours) [DEFAULT]
  #   defeat_all_bosses     - Defeat Yawie + all optional/vortex bosses (~25-35 hours)
  #   diamond_rank          - Defeat Yawie + reach Cooksta Diamond rank (~30-40 hours)
  #   master_diver          - Defeat Yawie + catch every fish species (~50-70 hours)
  #   hundred_percent       - Everything above combined (100+ hours)
  goal: defeat_yawie

  # ==================== FISH ====================
  # Which fish first-catches count as location checks?
  # Options: none | rare_only | all
  #   none       - No fish checks (fastest)
  #   rare_only  - Mid/deep/glacier/aberration fish only (~100 checks)
  #   all        - Every fish species first catch (~203 checks) [DEFAULT]
  fish_checks: all

  # ==================== RESTAURANT ====================
  # Which dish research levels count as location checks?
  # Options: none | key_dishes | popular | all
  #   none       - No dish upgrade checks
  #   key_dishes - ~20 important dishes only (~80 checks) [DEFAULT]
  #   popular    - ~50 commonly used dishes (~200 checks)
  #   all        - Every upgradeable dish (~549 checks)
  dish_upgrades: key_dishes

  # Which recipe unlocks count as checks?
  # Options: key_only | all
  #   key_only - Only story/VIP/boss recipes (~30 checks)
  #   all      - Every recipe unlock (~54 checks) [DEFAULT]
  recipe_checks: all

  # ==================== SIDE CONTENT ====================
  # Toggle each system on or off to control check count and scope.

  # Cooksta (social media app) rank milestones — 12 checks
  include_cooksta: true

  # Ecowatcher missions — 44 checks
  include_ecowatcher: true

  # Tako's photography missions — 12 checks
  include_photography: true

  # In-game challenges (can be difficult!) — 9 checks
  include_challenges: false

  # Vegetable farm harvesting — 13 checks
  include_farming: true

  # Chicken farm (egg collection, coop upgrades) — 9 checks
  include_chicken_farm: true

  # Fish farm breeding milestones — 15 checks
  include_fish_farm: true

  # Minigames (seahorse racing, etc.) — 4 checks
  include_minigames: true

  # Duff's weapon shop crafting — 79 checks
  include_weapon_shop: true

  # Staff hire + training checks
  # Options: none | hire_only | milestones | all_levels
  #   none       - No staff checks
  #   hire_only  - One check per staff when recruited (24 checks)
  #   milestones - Hire + Level 5/10/15/20 training checks [DEFAULT]
  #   all_levels - Hire + every level 1-20; items become "Progressive [Name]" x20
  staff_training_depth: milestones

  # First-find ingredient checks (sea plants, rare forageables, farm crops) — ~25 checks
  include_ingredient_checks: true

  # ==================== DLC ====================
  # Only enable DLC you actually own! Enabling DLC you don't have will add
  # unreachable locations and softlock your game.
  #
  # DREDGE Content Pack (free) — adds aberration fish + Drain Gun
  has_dredge_dlc: false

  # Godzilla Content Pack (free, time-limited) — adds 2 recipe locations
  has_godzilla_dlc: false

  # Ichiban's Holiday Content Pack (paid)
  has_ichiban_dlc: false

  # In the Jungle Content Pack (paid, releases June 18 2026)
  has_jungle_dlc: false

  # ==================== STARTING EQUIPMENT ====================
  # How many progressive upgrades to start with (saves early-game grind).

  # Progressive Oxygen Tank upgrades to start with (0-5)
  starting_oxygen_level: 1

  # Progressive Harpoon upgrades to start with (0-3)
  starting_harpoon_level: 1

  # Progressive Diving Suit level to start at (0-8)
  # Levels 7-8 are the cold-resistant suit tiers needed for Glacier Zone
  starting_diving_suit_level: 1

  # ==================== DIFFICULTY ====================
  # How many oxygen tank upgrades are required to reach deeper areas?
  # Options: lenient | normal | strict
  oxygen_requirement: normal

  # ==================== SPECIAL OPTIONS ====================
  # Death Link: When you die, all linked players die too (and vice versa)
  death_link: false

  # How teleport mirrors work
  # Options: required | fast_travel_only
  teleport_behavior: required

  # Trap item frequency
  # Options: none | low | medium | high
  trap_frequency: none
