# Dave the Diver - Master Diver Configuration
# Explore the ocean depths and catch 'em all!

name: MasterDiver

game: Dave the Diver

Dave the Diver:
  # Goal: Catch and catalog everything
  goal: master_diver
  
  # ALL fish checks!
  fish_checks: all
  require_all_fish: true
  
  # Minimal restaurant focus
  dish_upgrades: key_dishes
  recipe_checks: key_only
  require_all_recipes: false
  restaurant_rating_required: 0
  
  # Minimal Cooksta
  include_cooksta: false
  
  # Max exploration content
  include_ecowatcher: true
  include_photography: true
  include_challenges: true
  
  # Farming not critical for exploration
  include_farming: false
  include_fish_farm: false
  include_minigames: true
  
  # Standard starting equipment
  starting_oxygen_level: 1
  starting_harpoon_level: 1
  starting_diving_suit_level: 1
  
  # Strict difficulty for veteran divers
  oxygen_requirement: strict
  
  death_link: false
