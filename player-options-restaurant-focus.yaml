# Dave the Diver - Restaurant Tycoon Configuration
# Focus on running the best sushi restaurant!

name: RestaurantTycoon

game: Dave the Diver

Dave the Diver:
  # Goal: Restaurant perfection
  goal: restaurant_tycoon
  
  # Focus on fish needed for recipes, not all fish
  fish_checks: rare_only
  require_all_fish: false
  
  # Lots of dish and recipe content
  dish_upgrades: popular
  recipe_checks: all
  require_all_recipes: true
  restaurant_rating_required: 5
  
  # Include Cooksta (restaurant-focused)
  include_cooksta: true
  cooksta_followers_required: 10000
  
  # Skip some diving-focused content
  include_ecowatcher: false
  include_photography: true
  include_challenges: false
  
  # Include farming (ingredients!)
  include_farming: true
  include_fish_farm: true
  include_minigames: true
  
  # Standard starting equipment
  starting_oxygen_level: 1
  starting_harpoon_level: 1
  starting_diving_suit_level: 1
  
  oxygen_requirement: normal
  death_link: false
